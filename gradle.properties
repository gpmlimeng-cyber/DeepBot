# 必须与 apkbuild/gradle-direct.sh 启动 JVM 的参数逐字一致：Gradle 只有在「当前进程的
# 不可变 JVM 参数 == 请求的 daemon 参数」时才会 in-process 构建；本机 native-platform 的
# daemon 启动不可用（libnative-platform.so 依赖 libstdc++.so.6，Android 没有）。
org.gradle.jvmargs=-Xmx2048m -Xms64m -Dfile.encoding=UTF-8 -Djdk.lang.Process.launchMechanism=fork -Djava.io.tmpdir=/data/user/0/com.deepcode.shell/files/home/apkbuild/tmp -Djava.home=/data/user/0/com.deepcode.shell/files/usr/lib/jvm/java-17-openjdk
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 本机是 aarch64，Google 只发布 x86_64 宿主机的 aapt2 maven 产物，
# 因此显式指向本机已装好的 aapt2（2.20-android-16.0.0_r4，与 build-tools 36 同源）。
android.aapt2FromMavenOverride=/data/user/0/com.deepcode.shell/files/usr/bin/aapt2
# 内存很紧（可用约 3.7G）：Kotlin 编译放进 Gradle 进程，避免再起一个编译 daemon。
kotlin.compiler.execution.strategy=in-process
